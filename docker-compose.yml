name: movel


services:
  movel:
    build: .
    image: movel:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
    ports:
      # 서버의 127.0.0.1:${MOVEL_PORT} → 컨테이너 3000. 외부에는 열지 않고 nginx로 프록시한다
      - "127.0.0.1:${MOVEL_PORT:-3000}:3000"
    volumes:
      - ./data:/data
